name: iOS nutrition preview
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ios-nutrition-preview.yml'
      - 'Tools/ios-nutrition-preview/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - name: Add temporary UI capture target
        run: |
          python3 -m pip install --break-system-packages PyYAML
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          p = Path('project.yml')
          config = yaml.safe_load(p.read_text())
          config['targets']['NutritionPreviewTests'] = {
            'type': 'bundle.ui-testing', 'platform': 'iOS', 'deploymentTarget': '17.0',
            'sources': ['Tools/ios-nutrition-preview'],
            'dependencies': [{'target': 'NOOPiOS'}],
            'settings': {'base': {'PRODUCT_BUNDLE_IDENTIFIER': 'com.noopapp.nutritionpreview',
                                  'GENERATE_INFOPLIST_FILE': 'YES', 'TEST_TARGET_NAME': 'NOOPiOS'}}}
          config['schemes']['NutritionPreview'] = {
            'build': {'targets': {'NOOPiOS': 'all', 'NutritionPreviewTests': 'all'}},
            'test': {'config': 'Debug', 'targets': ['NutritionPreviewTests']}}
          p.write_text(yaml.safe_dump(config, sort_keys=False))
          PY
          xcodegen generate
      - name: Build and seed simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          echo "PREVIEW_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          xcodebuild -scheme NOOPiOS -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/preview CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build-ios.log 2>&1
          xcrun simctl install "$DEVICE" "build/preview/Build/Products/Debug-iphonesimulator/NOOP Staging.app"
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" com.noopapp.noop data)
          python3 Tools/ios-nutrition-preview/seed.py "$CONTAINER"
      - name: Capture production views
        run: |
          xcodebuild -scheme NutritionPreview -configuration Debug -destination "platform=iOS Simulator,id=$PREVIEW_DEVICE" -derivedDataPath build/preview -resultBundlePath build/NutritionPreview.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test > capture-ios.log 2>&1
          mkdir -p build/ios-preview
          xcrun xcresulttool export attachments --path build/NutritionPreview.xcresult --output-path build/ios-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-nutrition-preview
          path: |
            build/ios-preview
            build-ios.log
            capture-ios.log
          retention-days: 14
